    const recurringTotal = data.recurringCategories.reduce((s, {
      id
    }) => s + Number(getRecurring(data, id, CURRENT_YEAR).months[idx] || 0), 0);
    const oneoffTotal = data.expenses.filter(e => dYear(e.date) === CURRENT_YEAR && dMonth(e.date) === m).reduce((s, e) => s + Number(e.amount || 0), 0);
    const totalExpense = recurringTotal + oneoffTotal;
    const profit = totalIncome - totalExpense;
    return {
      month: m,
      pension,
      other,
      rentBySource,
      totalIncome,
      totalExpense,
      profit,
      savingsPct: totalIncome ? profit / totalIncome : 0
    };
  });
  let cum = 0;
  return rows.map(r => {
    cum += r.profit;
    return {
      ...r,

}
function computeHalfYearly(monthly) {
  const agg = arr => {
    const income = arr.reduce((s, r) => s + r.totalIncome, 0);
    const expense = arr.reduce((s, r) => s + r.totalExpense, 0);
    return {
      income,
      expense,
      profit: income - expense
    };
  };
  return {
    h1: agg(monthly.slice(0, 6)),
    h2: agg(monthly.slice(6, 12))
  };
}
function computeYearly(monthly) {
  const income = monthly.reduce((s, r) => s + r.totalIncome, 0);
  const expense = monthly.reduce((s, r) => s + r.totalExpense, 0);
  const avgSavings = monthly.reduce((s, r) => s + r.savingsPct, 0) / 12;
  return {
    income,
    expense,
    profit: income - expense,
    avgIncome: income / 12,
    avgExpense: expense / 12,
    avgSavings
  };
}
function computeCategoryTotals(data) {

  }));
  return [...rec, ...off].sort((a, b) => b.total - a.total);
}
function computeIncomeTotals(monthly, data) {

function computeCashBank(data) {
  const cashIn = data.income.filter(e => e.cashBank === "Cash").reduce((s, e) => s + Number(e.received || 0), 0) + Object.values(data.rent).filter(r => r.cashBank === "Cash").reduce((s, r) => s + Number(r.received || 0), 0);
  const bankIn = data.income.filter(e => e.cashBank === "Bank").reduce((s, e) => s + Number(e.received || 0), 0) + Object.values(data.rent).filter(r => r.cashBank === "Bank").reduce((s, r) => s + Number(r.received || 0), 0);
  let cashOutRec = 0,
    bankOutRec = 0;
  Object.entries(data.recurring).forEach(([key, rec]) => {
    const catId = key.split("|")[0];
    const cat = data.recurringCategories.find(c => c.id === catId);
    const total = (rec.months || []).reduce((a, b) => a + Number(b || 0), 0);
    if (cat?.method === "Cash") cashOutRec += total;else if (cat?.method === "Bank") bankOutRec += total;
  });
  const cashOutOff = data.expenses.filter(e => e.cashBank === "Cash").reduce((s, e) => s + Number(e.amount || 0), 0);
  const bankOutOff = data.expenses.filter(e => e.cashBank === "Bank").reduce((s, e) => s + Number(e.amount || 0), 0);
  let cashInTransfer = 0, cashOutTransfer = 0, bankInTransfer = 0, bankOutTransfer = 0;
  (data.transfers || []).forEach(t => {
    const amt = Number(t.amount || 0);
    if (t.direction === "bankToCash") { cashInTransfer += amt; bankOutTransfer += amt; }
    else if (t.direction === "cashToBank") { bankInTransfer += amt; cashOutTransfer += amt; }
  });
  const cashOut = cashOutRec + cashOutOff + cashOutTransfer,
    bankOut = bankOutRec + bankOutOff + bankOutTransfer;
  const cashInTotal = cashIn + cashInTransfer, bankInTotal = bankIn + bankInTransfer;
  return {
    cashIn: cashInTotal,
    bankIn: bankInTotal,
    cashOut,
    bankOut,
    cashInHand: Number(data.openingCash || 0) + cashInTotal - cashOut,
    bankBalance: Number(data.openingBank || 0) + bankInTotal - bankOut
  };
}
// Per-named-bank-account balances, based on the optional accountId tag on
// Bank-tagged Income/Expense/Rent entries and Bank-method Recurring bills.
function computeAccountBalances(data) {
  const accounts = data.bankAccounts || [];
  return accounts.map(acc => {
    let inAmt = 0, outAmt = 0;
    data.income.forEach(e => { if (e.cashBank === "Bank" && e.accountId === acc.id) inAmt += Number(e.received || 0); });
    Object.values(data.rent || {}).forEach(r => { if (r.cashBank === "Bank" && r.accountId === acc.id) inAmt += Number(r.received || 0); });
    data.expenses.forEach(e => { if (e.cashBank === "Bank" && e.accountId === acc.id) outAmt += Number(e.amount || 0); });
    Object.entries(data.recurring || {}).forEach(([key, rec]) => {
      const catId = key.split("|")[0];
      const cat = data.recurringCategories.find(c => c.id === catId);
      if (cat?.method === "Bank" && cat.accountId === acc.id) outAmt += (rec.months || []).reduce((a,b)=>a+Number(b||0),0);
    });
    (data.transfers || []).forEach(t => {
      if (t.accountId !== acc.id) return;
      if (t.direction === "bankToCash") outAmt += Number(t.amount || 0);
      else if (t.direction === "cashToBank") inAmt += Number(t.amount || 0);
    });
    const balance = Number(acc.openingBalance || 0) + inAmt - outAmt;
    return { ...acc, inAmt, outAmt, balance };
  });
}

// All-time outstanding balance per tenant, across every year ever recorded -
// this is how old/previous pending rent stays visible even after the year rolls over.
function tenantOutstanding(data, unitId) {
  let expected = 0,
    received = 0;
  Object.entries(data.rent || {}).forEach(([key, rec]) => {
    if (key.split("|")[0] === unitId) {
      expected += Number(rec.due || 0);
      received += Number(rec.received || 0);
    }
  });
  return {
    expected,
    received,
    pending: expected - received
  };
}
// Family spend is based purely on the Family Member tag chosen on each Expense Entry row.
// (Family members and recurring bill categories are both independently renameable now,
// so we no longer guess associations by matching category names.)
function computeAnalytics(data, categoryTotals) {
  const top = categoryTotals[0] || {
    name: "-",
    total: 0
  };
  const famBase = {};
  (data.familyMembers || []).forEach(m => {
    famBase[m] = 0;
  });
  data.expenses.forEach(e => {
    if (famBase[e.familyMember] !== undefined) famBase[e.familyMember] += Number(e.amount || 0);
  });
  const familySpend = Object.entries(famBase).map(([name, total]) => ({
    name,
    total
  })).sort((a, b) => b.total - a.total);
  const tenants = (data.rentUnits || []).map(u => {
    const {
      expected,
      received,
      pending
    } = tenantOutstanding(data, u.id);
    return {
      unit: u.name,
      expected,
      received,
      pending,
      pct: expected ? received / expected : 0
    };
  });
  return {
    top,
    familySpend,
    tenants
  };
}
function computeHealth(data, yearly) {
  const savingsRate = yearly.income ? Math.max(0, yearly.profit / yearly.income) : 0;
  const expected = Object.values(data.rent).reduce((s, r) => s + Number(r.due || 0), 0);
  const received = Object.values(data.rent).reduce((s, r) => s + Number(r.received || 0), 0);
  const collectionRate = expected ? received / expected : 1;
  return {
    score: Math.round(Math.max(0, Math.min(100, savingsRate * 60 + collectionRate * 40))),
    collectionRate
  };
}
// Reminders: rent (has a due date) that is overdue or due within the next 3 days and still pending.
function computeReminders(data) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const soon = new Date(today);
  soon.setDate(soon.getDate() + 3);
  const items = [];
  Object.values(data.rent || {}).forEach(rec => {
    const pending = Number(rec.due || 0) - Number(rec.received || 0);
    if (pending > 0 && rec.dueDate) {
      const dd = new Date(rec.dueDate);
      if (!isNaN(dd) && dd <= soon) {
        items.push({
          label: rec.unit || "Rent",
          amount: pending,
          dueDate: rec.dueDate,
          overdue: dd < today
        });
      }
    }
  });
  (data.income || []).forEach(e => {
    const pending = Number(e.expected || 0) - Number(e.received || 0);
    if (pending > 0 && e.dueDate) {
      const dd = new Date(e.dueDate);
      if (!isNaN(dd) && dd <= soon) {
        items.push({
          label: e.source || "Income",
          amount: pending,
          dueDate: e.dueDate,
          overdue: dd < today
        });
      }
    }
  });
  const curMonth = MONTHS[today.getMonth()];
  (data.recurringCategories || []).forEach(cat => {
    if (!cat.dueDay) return;
    const monthsArr = getRecurring(data, cat.id, CURRENT_YEAR).months;
    const paid = monthsArr[today.getMonth()] || 0;
    if (paid > 0) return;
    const dd = new Date(today.getFullYear(), today.getMonth(), Number(cat.dueDay));
    if (dd <= soon) {
      const prevIdx = today.getMonth() > 0 ? today.getMonth()-1 : 11;
      const estimate = monthsArr[prevIdx] || 0;
      items.push({
        label: `${cat.name} (bill, andaza)`,
        amount: estimate,
        dueDate: dd.toISOString().slice(0,10),
        overdue: dd < today
      });
    }
  });
  return items.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
}
